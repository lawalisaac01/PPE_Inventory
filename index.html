<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14181c" />
  <meta name="description" content="ARAHAS PPE Offline-First Inventory – Available & Defective stock capture" />
  <title>ARAHAS PPE Inventory</title>
  <style>
    :root {
      --bg: #14181c;
      --bg-soft: #191f24;
      --card: #1d252b;
      --card-head: #232d34;
      --border: #303b42;
      --border-soft: #263039;
      --text: #edf1f3;
      --muted: #8a9aa4;
      --muted-dim: #5f6d76;
      --yellow: #ffcc33;
      --yellow-dim: #4a4020;
      --orange: #ff8a4c;
      --ok: #35c98a;
      --ok-dim: #1c3a2e;
      --warn: #ffcc33;
      --danger: #ff6b6b;
      --input: #12171b;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-padding-top: 6.5rem; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background:
        radial-gradient(1100px 480px at 90% -10%, rgba(255,204,51,.05), transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100dvh;
      padding: 0 0 5rem;
    }

    /* ---------- Header ---------- */
    header {
      position: sticky; top: 0; z-index: 60;
      background: rgba(20,24,28,.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      padding: .8rem 1rem .6rem;
      display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between;
      max-width: 980px; margin: 0 auto;
    }
    .brand { display: flex; align-items: center; gap: .6rem; }
    .brand-mark {
      width: 32px; height: 32px; flex: none;
      display: grid; place-items: center;
      background: var(--yellow);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }
    .brand-mark svg { width: 18px; height: 18px; }
    h1 { font-size: 1rem; font-weight: 700; letter-spacing: .01em; }
    h1 span { display: block; font-size: .68rem; font-weight: 500; color: var(--muted); letter-spacing: .04em; margin-top: .1rem; }
    .status {
      display: flex; gap: .55rem; align-items: center; font-size: .78rem; color: var(--muted);
    }
    .dot {
      width: .5rem; height: .5rem; border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(255,107,107,.15);
    }
    .dot.online { background: var(--ok); box-shadow: 0 0 0 3px rgba(53,201,138,.15); }

    /* Quick nav strip */
    .quicknav {
      display: flex; gap: .4rem; overflow-x: auto;
      padding: 0 1rem .7rem; max-width: 980px; margin: 0 auto;
      scrollbar-width: none;
    }
    .quicknav::-webkit-scrollbar { display: none; }
    .navchip {
      flex: none;
      display: flex; align-items: center; gap: .35rem;
      font-size: .74rem; font-weight: 600; color: var(--muted);
      background: var(--bg-soft); border: 1px solid var(--border-soft);
      padding: .35rem .65rem; border-radius: 999px;
      cursor: pointer; white-space: nowrap;
    }
    .navchip svg { width: 13px; height: 13px; opacity: .8; }
    .navchip .count { color: var(--muted-dim); font-weight: 500; }
    .navchip.complete { border-color: rgba(53,201,138,.35); color: var(--ok); }
    .navchip.complete .count { color: var(--ok); opacity: .7; }

    main { max-width: 980px; margin: 0 auto; padding: 1rem; }

    /* ---------- Stats & toolbar ---------- */
    .statbar {
      display: grid; grid-template-columns: repeat(4,1fr); gap: .6rem;
      margin-bottom: 1rem;
    }
    .stat {
      background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius);
      padding: .65rem .75rem;
    }
    .stat .num { font-size: 1.25rem; font-weight: 700; line-height: 1.1; }
    .stat .lbl { font-size: .68rem; color: var(--muted); margin-top: .15rem; text-transform: uppercase; letter-spacing: .04em; }
    .stat.avail .num { color: var(--yellow); }
    .stat.defect .num { color: var(--orange); }
    .stat.progress .num { color: var(--ok); }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .7rem;
    }
    button, .btn {
      appearance: none; border: 1px solid var(--border);
      background: var(--card); color: var(--text);
      padding: .55rem .9rem; border-radius: 8px; font-size: .82rem;
      cursor: pointer; font-weight: 600;
      transition: border-color .15s, transform .1s;
    }
    button:hover { border-color: var(--yellow); }
    button:active { transform: scale(.98); }
    button.primary { background: var(--yellow); color: #1a1400; border-color: transparent; }
    button.primary:disabled { opacity: .4; cursor: not-allowed; }
    button.ghost { background: transparent; color: var(--muted); }

    .searchbar {
      position: relative; margin-bottom: 1.1rem;
    }
    .searchbar svg {
      position: absolute; left: .7rem; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; color: var(--muted-dim); pointer-events: none;
    }
    .searchbar input {
      width: 100%; background: var(--card); border: 1px solid var(--border-soft);
      color: var(--text); padding: .6rem .8rem .6rem 2.1rem; border-radius: 999px;
      font-size: .85rem;
    }
    .searchbar input:focus { outline: none; border-color: var(--yellow); }

    .meta {
      font-size: .74rem; color: var(--muted-dim); margin-bottom: 1rem;
      display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center;
    }
    .meta .sep { opacity: .5; }

    /* ---------- Category sections ---------- */
    section.cat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: .85rem;
      overflow: hidden;
      scroll-margin-top: 6.5rem;
    }
    section.cat > summary, .cat-head {
      list-style: none;
      padding: .8rem .95rem;
      cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: .6rem;
      background: var(--card-head);
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    section.cat > summary::-webkit-details-marker { display: none; }
    .cat-head-left { display: flex; align-items: center; gap: .6rem; min-width: 0; }
    .cat-icon {
      width: 30px; height: 30px; flex: none; border-radius: 8px;
      background: var(--yellow-dim); color: var(--yellow);
      display: grid; place-items: center;
    }
    .cat-icon svg { width: 16px; height: 16px; }
    .cat-title { font-weight: 700; font-size: .92rem; }
    .cat-sub { font-size: .7rem; color: var(--muted-dim); margin-top: .05rem; }
    .cat-badge {
      font-size: .7rem; font-weight: 700; color: var(--muted);
      background: var(--bg-soft); border: 1px solid var(--border-soft);
      padding: .25rem .55rem; border-radius: 999px; flex: none;
    }
    .cat-badge.complete { color: var(--ok); border-color: rgba(53,201,138,.3); background: var(--ok-dim); }
    .chev { width: 16px; height: 16px; color: var(--muted-dim); transition: transform .18s; flex: none; }
    details[open] > summary .chev { transform: rotate(180deg); }

    .cat-body { padding: .7rem .8rem .9rem; }
    .item-block {
      margin: .6rem 0;
      padding: .7rem;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      background: var(--bg-soft);
    }
    .item-block.hidden { display: none; }
    .item-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; margin-bottom: .55rem; }
    .item-title {
      font-size: .76rem;
      color: var(--muted);
      white-space: pre-line;
      line-height: 1.4;
    }
    .item-title strong { color: var(--text); font-size: .87rem; display: block; margin-bottom: .1rem; }
    .item-fill { font-size: .68rem; color: var(--muted-dim); white-space: nowrap; flex: none; padding-top: .15rem; }

    .rows { display: grid; gap: .35rem; }
    .row {
      display: grid;
      grid-template-columns: minmax(64px, 84px) 1fr 1fr;
      gap: .4rem;
      align-items: center;
      font-size: .85rem;
    }
    .row.header {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted-dim);
      padding-bottom: .15rem;
    }
    .row.header .lbl-avail { color: var(--yellow); opacity: .85; }
    .row.header .lbl-defect { color: var(--orange); opacity: .85; }
    .size {
      font-weight: 700;
      color: var(--text);
      text-align: center;
      padding: .4rem .3rem;
      background: var(--input);
      border-radius: 6px;
      border: 1px solid var(--border-soft);
      font-size: .78rem;
    }
    .size.filled { border-color: var(--yellow); box-shadow: inset 0 0 0 1px rgba(255,204,51,.25); }

    input[type="number"] {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border-soft);
      color: var(--text);
      padding: .42rem .5rem;
      border-radius: 6px;
      font-size: .88rem;
      -moz-appearance: textfield;
      text-align: center;
    }
    input[type="number"].avail:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 2px rgba(255,204,51,.2); }
    input[type="number"].defect:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 2px rgba(255,138,76,.2); }
    input[type="number"].has-val.avail { border-color: rgba(255,204,51,.45); }
    input[type="number"].has-val.defect { border-color: rgba(255,138,76,.5); color: var(--orange); }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .single-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem;
    }
    .field label {
      display: block;
      font-size: .66rem;
      color: var(--muted-dim);
      margin-bottom: .25rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .field.avail label { color: var(--yellow); opacity: .85; }
    .field.defect label { color: var(--orange); opacity: .85; }

    .toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
      background: #1d252b; border: 1px solid var(--border);
      color: var(--text); padding: .65rem 1.1rem; border-radius: 999px;
      font-size: .85rem; z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; box-shadow: 0 10px 28px rgba(0,0,0,.45);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    .toast.ok { border-color: var(--ok); }
    .toast.warn { border-color: var(--warn); }
    .toast.err { border-color: var(--danger); }

    .empty-state { text-align: center; color: var(--muted-dim); font-size: .82rem; padding: 2rem 0; }

    footer {
      text-align: center; font-size: .7rem; color: var(--muted-dim);
      padding: 1.5rem 1rem 2rem;
    }

    @media (max-width: 520px) {
      .row { grid-template-columns: 58px 1fr 1fr; }
      .statbar { grid-template-columns: repeat(2,1fr); }
      h1 { font-size: .92rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1a1400" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 3.8 8.6 9 10 5.2-1.4 9-5 9-10V6l-9-4Z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <h1>ARAHAS PPE Inventory<span>Field stock count · Available &amp; defective</span></h1>
      </div>
      <div class="status">
        <span class="dot" id="netDot" title="Network"></span>
        <span id="netLabel">Offline</span>
        <span>·</span>
        <span id="saveLabel">Local only</span>
      </div>
    </div>
    <div class="quicknav" id="quicknav"></div>
  </header>

  <main>
    <div class="statbar" id="statbar">
      <div class="stat progress"><div class="num" id="statProgress">0%</div><div class="lbl">Entries filled</div></div>
      <div class="stat avail"><div class="num" id="statAvail">0</div><div class="lbl">Total available</div></div>
      <div class="stat defect"><div class="num" id="statDefect">0</div><div class="lbl">Total defective</div></div>
      <div class="stat"><div class="num" id="statCats">0/0</div><div class="lbl">Categories done</div></div>
    </div>

    <div class="toolbar">
      <button class="primary" id="btnSync" disabled>Sync to Google Sheet</button>
      <button class="ghost" id="btnSave">Save locally</button>
      <button class="ghost" id="btnExport">Export JSON</button>
      <button class="ghost" id="btnClear">Clear draft</button>
    </div>

    <div class="searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search an item — e.g. boot, coverall, ear plug…" />
    </div>

    <div class="meta">
      <span>Sheet: Phase_2_Oct 26</span>
      <span class="sep">·</span>
      <span id="lastSaved">Never saved</span>
      <span class="sep">·</span>
      <span id="lastSynced">Never synced</span>
    </div>

    <div id="formRoot"></div>
  </main>

  <div class="toast" id="toast"></div>
  <footer>
    Offline-first · saved to this device · syncs to the Google Sheet when online
  </footer>

  <script>
  /* ========== CONFIG – paste your Apps Script Web App URL after deploy ========== */
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygcxn_MfpJoZ5WQi28qgvmvWQpCU7MuGWytqe0le86DX6UgRNzx2JYj6SAhk-V1NPRUg/exec";
  /* =========================================================================== */

  const STORAGE_KEY = "arahas_ppe_inventory_v1";
  const META_KEY = "arahas_ppe_inventory_meta_v1";

  /* ---------- Icons (inline, stroke-based) ---------- */
  const ICONS = {
    boot:     '<path d="M9 3v7.5c0 1-.5 1.8-1.3 2.4L4 16v3a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2c0-2.5-1.8-3.6-4-4.2-2.3-.6-4-1.4-4-3.8V3Z"/><path d="M9 3h6"/>',
    coverall: '<path d="M8 3h8l1 4-2 1v11a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V8L7 7Z"/><path d="M8 10l-3 3v4"/><path d="M16 10l3 3v4"/>',
    hardhat:  '<path d="M4 15a8 8 0 0 1 16 0Z"/><path d="M2 15h20"/><path d="M12 7V4"/>',
    glove:    '<path d="M7 11V5a1.5 1.5 0 0 1 3 0v5"/><path d="M10 10V4a1.5 1.5 0 0 1 3 0v6"/><path d="M13 10V5a1.5 1.5 0 0 1 3 0v7"/><path d="M16 12V8a1.5 1.5 0 0 1 3 0v6c0 3.5-2 6-6 6H9c-2.8 0-4-1.6-4-4v-3.5c0-1 .5-1.7 1.4-2.2L8 11"/>',
    earplug:  '<circle cx="9" cy="9" r="3.5"/><path d="M11.5 11.5 19 19"/><path d="m17 17 3 3"/>',
    goggles:  '<circle cx="7.5" cy="12" r="3.5"/><circle cx="16.5" cy="12" r="3.5"/><path d="M11 12h2"/><path d="M4.5 9 3 7.5"/><path d="M19.5 9 21 7.5"/>',
    raincoat: '<path d="M9 3h6l1 3-2 1.5V19a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V7.5L8 6Z"/><path d="M8 9 5 12v5"/><path d="M16 9l3 3v5"/>',
    umbrella: '<path d="M12 3a9 9 0 0 1 9 9H3a9 9 0 0 1 9-9Z"/><path d="M12 12v7a2 2 0 0 1-3 1.7"/><path d="M12 3v1"/>'
  };
  function icon(name) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.boot}</svg>`;
  }

  /* Exact catalogue matching Investory - PPEs.xlsx (Phase_2_Oct 26) */
  const CATALOGUE = [
    {
      id: "safety_boots",
      title: "Safety Boots",
      icon: "boot",
      groups: [
        {
          key: "safety_joggers",
          label: "Safety Boot\nType: Low/Ankle Shoes\nBrand : Safety Joggers\nStandard: BS EN ISO 20345, ASTM F2413-18 & ASTM F3445-21",
          sizes: ["50","49","48","47","46","45","44","43","42","41","40","39","38"],
          uom: "Pairs"
        },
        {
          key: "redwings",
          label: "Safety Boot\nType: Low/Ankle Shoes\nBrand : Redwings\nStandard: BS EN ISO 20345, ASTM F2413-18 & ASTM F3445-21",
          sizes: ["50","49","48","47","46","45","44","43","42","41","40","39","38"],
          uom: "Pairs"
        }
      ]
    },
    {
      id: "coverall",
      title: "Coverall",
      icon: "coverall",
      groups: [
        {
          key: "coverall_single",
          label: "Coverall (Single)\nType: Flame-Resistant Workwear\nBrand : Red Wing / Protex\nStandard: EN ISO 11612:2015 · EN ISO 14116:2015 · EN ISO 11611:2015",
          sizes: ["XXXXL","XXXL","XXL","XL","L","M"],
          uom: "pieces"
        },
        {
          key: "coverall_2piece",
          label: "Coverall (2 Piece)\nType: Flame-Resistant Workwear\nBrand : Red Wing\nStandard: EN ISO 11612:2015 · EN ISO 14116:2015 · EN ISO 11611:2015",
          sizes: ["XXXXL","XXXL","XXL","XL","L","M"],
          uom: "pieces"
        }
      ]
    },
    {
      id: "utilities",
      title: "Utilities",
      icon: "hardhat",
      groups: [
        {
          key: "hard_hats",
          label: "Hard hats (MSA/V-gard)\nType: Type I · Class E & Class G\nBrand: MSA V-Gard\nStandard: ANSI Z89.1-2003 · CSA Z94.1-05",
          sizes: null,
          uom: "pieces",
          icon: "hardhat"
        },
        {
          key: "impact_gloves",
          label: "Impact resistant Hand gloves",
          sizes: ["Large Size"],
          uom: "Dozens",
          icon: "glove"
        },
        {
          key: "cotton_gloves",
          label: "Cotton dotted hand gloves (Beta Polka Dotted)",
          sizes: ["Large Size"],
          uom: "Dozens",
          icon: "glove"
        },
        {
          key: "ear_plugs",
          label: "Ear plugs (3M UltraFit™)\nType: OPTIME™ 3 · 25 dB attenuation\nBrand: 3M UltraFit™ (Yellow Plug / E-A-R)\nStandard: AS/NZS 1270:2002 Class 3 · NRR 25 dB (EPA)",
          sizes: ["3M Ear plugs- corded"],
          uom: "pieces",
          icon: "earplug"
        },
        {
          key: "earmuffs",
          label: "Earmuffs",
          sizes: ["3M Hardhat mounted"],
          uom: "pieces",
          icon: "earplug"
        },
        {
          key: "goggles",
          label: "Safety goggles\nType: 1 EA · Made in U.S.A.\nBrand: Astrospec 3000 · Black Frame – Clean Lens\nStandard: CSA Z94.3 / Z87.1+ (ANSI Z87.1 equivalent)",
          sizes: ["Uvex (Clear and Dark)"],
          uom: "pieces",
          icon: "goggles"
        }
      ]
    },
    {
      id: "rain_boot",
      title: "Rain Boot",
      icon: "boot",
      groups: [
        {
          key: "rain_boot_trucker",
          label: "Rain Boot - Steel Toe (NINGO)\nType: S5 safety footwear (steel toe + penetration resistance, energy absorption heel)\nBrand: TRUCKER (Industrie Calzature)\nStandard: EN 345-1 S5 · ISO 6110 · ISO 6112 (CE marked)",
          sizes: ["50","49","48","47","46","45","44","43","42","41","40","39","38"],
          uom: "pieces"
        }
      ]
    },
    {
      id: "rain_coat",
      title: "Rain Coat",
      icon: "raincoat",
      groups: [
        {
          key: "raincoat_zutech",
          label: "Raincoat (Zutech Safety)",
          sizes: ["XXXL","XXL","XL","L","M"],
          uom: "pieces"
        }
      ]
    },
    {
      id: "umbrella",
      title: "Umbrella",
      icon: "umbrella",
      groups: [
        {
          key: "umbrella",
          label: "Umbrella",
          sizes: null,
          uom: "pieces"
        }
      ]
    }
  ];

  /* ---------- State ---------- */
  let data = {};          // { groupKey: { sizeOr"_": { available, defective } } }
  let meta = { lastSaved: null, lastSynced: null, dirty: false };
  let searchTerm = "";

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) data = JSON.parse(raw);
      const m = localStorage.getItem(META_KEY);
      if (m) meta = JSON.parse(m);
    } catch (e) {
      console.warn("Load failed", e);
      data = {};
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      meta.lastSaved = new Date().toISOString();
      meta.dirty = true;
      localStorage.setItem(META_KEY, JSON.stringify(meta));
      updateMetaUI();
      updateStats();
      return true;
    } catch (e) {
      toast("Local save failed – storage full?", "err");
      return false;
    }
  }

  function getVal(groupKey, size, field) {
    const g = data[groupKey] || {};
    const s = g[size == null ? "_" : String(size)] || {};
    return s[field] != null ? s[field] : "";
  }

  function setVal(groupKey, size, field, value) {
    if (!data[groupKey]) data[groupKey] = {};
    const k = size == null ? "_" : String(size);
    if (!data[groupKey][k]) data[groupKey][k] = { available: "", defective: "" };
    data[groupKey][k][field] = value === "" ? "" : Number(value);
    meta.dirty = true;
  }

  /* ---------- Stats ---------- */
  function groupCells(g) {
    return g.sizes && g.sizes.length ? g.sizes.length : 1;
  }
  function groupFilled(g) {
    let n = 0;
    const keys = g.sizes && g.sizes.length ? g.sizes : [null];
    keys.forEach(sz => {
      const a = getVal(g.key, sz, "available");
      const d = getVal(g.key, sz, "defective");
      if (a !== "" || d !== "") n++;
    });
    return n;
  }
  function computeStats() {
    let totalCells = 0, filledCells = 0, sumAvail = 0, sumDefect = 0;
    let catsDone = 0;
    CATALOGUE.forEach(cat => {
      let catCells = 0, catFilled = 0;
      cat.groups.forEach(g => {
        const cells = groupCells(g);
        const filled = groupFilled(g);
        catCells += cells; catFilled += filled;
        totalCells += cells; filledCells += filled;
        const keys = g.sizes && g.sizes.length ? g.sizes : [null];
        keys.forEach(sz => {
          const a = Number(getVal(g.key, sz, "available")) || 0;
          const d = Number(getVal(g.key, sz, "defective")) || 0;
          sumAvail += a; sumDefect += d;
        });
      });
      if (catFilled >= catCells && catCells > 0) catsDone++;
    });
    return { totalCells, filledCells, sumAvail, sumDefect, catsDone, totalCats: CATALOGUE.length };
  }
  function updateStats() {
    const s = computeStats();
    const pct = s.totalCells ? Math.round((s.filledCells / s.totalCells) * 100) : 0;
    document.getElementById("statProgress").textContent = pct + "%";
    document.getElementById("statAvail").textContent = s.sumAvail.toLocaleString();
    document.getElementById("statDefect").textContent = s.sumDefect.toLocaleString();
    document.getElementById("statCats").textContent = s.catsDone + "/" + s.totalCats;

    /* refresh quicknav badges */
    CATALOGUE.forEach(cat => {
      let cells = 0, filled = 0;
      cat.groups.forEach(g => { cells += groupCells(g); filled += groupFilled(g); });
      const chip = document.querySelector('.navchip[data-cat="' + cat.id + '"]');
      if (chip) {
        chip.querySelector(".count").textContent = filled + "/" + cells;
        chip.classList.toggle("complete", cells > 0 && filled >= cells);
      }
      const badge = document.querySelector('.cat-badge[data-cat="' + cat.id + '"]');
      if (badge) {
        badge.textContent = filled + "/" + cells + " filled";
        badge.classList.toggle("complete", cells > 0 && filled >= cells);
      }
    });
  }

  /* ---------- Render ---------- */
  function buildQuicknav() {
    const nav = document.getElementById("quicknav");
    nav.innerHTML = CATALOGUE.map(cat => `
      <div class="navchip" data-cat="${cat.id}" onclick="document.getElementById('sec-${cat.id}').scrollIntoView({behavior:'smooth', block:'start'})">
        ${icon(cat.icon || "boot")}
        <span>${cat.title}</span>
        <span class="count">0/0</span>
      </div>
    `).join("");
  }

  function render() {
    const root = document.getElementById("formRoot");
    root.innerHTML = "";
    let anyVisible = false;

    CATALOGUE.forEach(cat => {
      const details = document.createElement("details");
      details.className = "cat";
      details.id = "sec-" + cat.id;
      details.open = true;

      const sum = document.createElement("summary");
      sum.className = "cat-head";
      sum.innerHTML = `
        <div class="cat-head-left">
          <div class="cat-icon">${icon(cat.icon || "boot")}</div>
          <div>
            <div class="cat-title">${cat.title}</div>
            <div class="cat-sub">${cat.groups.length} item${cat.groups.length > 1 ? "s" : ""}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:.5rem;">
          <span class="cat-badge" data-cat="${cat.id}">0/0 filled</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      `;
      details.appendChild(sum);

      const body = document.createElement("div");
      body.className = "cat-body";
      let catHasVisible = false;

      cat.groups.forEach(g => {
        const firstLine = g.label.split("\n")[0];
        const matches = !searchTerm ||
          g.label.toLowerCase().includes(searchTerm) ||
          cat.title.toLowerCase().includes(searchTerm);

        const block = document.createElement("div");
        block.className = "item-block" + (matches ? "" : " hidden");
        if (matches) { catHasVisible = true; anyVisible = true; }

        const filled = groupFilled(g);
        const cells = groupCells(g);

        const titleRow = document.createElement("div");
        titleRow.className = "item-title-row";
        titleRow.innerHTML = `
          <div class="item-title"><strong>${firstLine}</strong>${g.label.split("\n").slice(1).join("\n")}</div>
          <div class="item-fill">${filled}/${cells}</div>
        `;
        block.appendChild(titleRow);

        if (g.sizes && g.sizes.length) {
          const rows = document.createElement("div");
          rows.className = "rows";
          const hdr = document.createElement("div");
          hdr.className = "row header";
          hdr.innerHTML = `<div>Size</div><div class="lbl-avail">Available</div><div class="lbl-defect">Defective</div>`;
          rows.appendChild(hdr);

          g.sizes.forEach(sz => {
            const av = getVal(g.key, sz, "available");
            const de = getVal(g.key, sz, "defective");
            const row = document.createElement("div");
            row.className = "row";
            row.innerHTML = `
              <div class="size ${av !== "" || de !== "" ? "filled" : ""}">${sz}</div>
              <input type="number" class="avail ${av !== "" ? "has-val" : ""}" min="0" step="1" inputmode="numeric" data-g="${g.key}" data-s="${sz}" data-f="available" value="${av}" placeholder="0" />
              <input type="number" class="defect ${de !== "" ? "has-val" : ""}" min="0" step="1" inputmode="numeric" data-g="${g.key}" data-s="${sz}" data-f="defective" value="${de}" placeholder="0" />
            `;
            rows.appendChild(row);
          });
          block.appendChild(rows);
        } else {
          const av = getVal(g.key, null, "available");
          const de = getVal(g.key, null, "defective");
          const wrap = document.createElement("div");
          wrap.className = "single-row";
          wrap.innerHTML = `
            <div class="field avail">
              <label>Available (${g.uom})</label>
              <input type="number" class="avail ${av !== "" ? "has-val" : ""}" min="0" step="1" inputmode="numeric" data-g="${g.key}" data-s="_" data-f="available" value="${av}" placeholder="0" />
            </div>
            <div class="field defect">
              <label>Defective (${g.uom})</label>
              <input type="number" class="defect ${de !== "" ? "has-val" : ""}" min="0" step="1" inputmode="numeric" data-g="${g.key}" data-s="_" data-f="defective" value="${de}" placeholder="0" />
            </div>
          `;
          block.appendChild(wrap);
        }
        body.appendChild(block);
      });

      details.appendChild(body);
      details.style.display = catHasVisible ? "" : "none";
      root.appendChild(details);
    });

    if (!anyVisible) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No items match “" + searchTerm + "”.";
      root.appendChild(empty);
    }

    /* bind inputs */
    root.querySelectorAll("input[type=number]").forEach(inp => {
      inp.addEventListener("change", onInput);
      inp.addEventListener("blur", onInput);
    });

    updateStats();
  }

  function onInput(e) {
    const el = e.target;
    const g = el.dataset.g;
    const s = el.dataset.s === "_" ? null : el.dataset.s;
    const f = el.dataset.f;
    setVal(g, s, f, el.value);
    el.classList.toggle("has-val", el.value !== "");
    persist();
    render(); // refresh fill badges & size-chip highlight, preserves values from `data`
  }

  /* ---------- UI helpers ---------- */
  function updateMetaUI() {
    document.getElementById("lastSaved").textContent =
      meta.lastSaved ? "Saved " + new Date(meta.lastSaved).toLocaleString() : "Never saved";
    document.getElementById("lastSynced").textContent =
      meta.lastSynced ? "Synced " + new Date(meta.lastSynced).toLocaleString() : "Never synced";
    document.getElementById("saveLabel").textContent =
      meta.dirty ? "Local draft (unsynced)" : (meta.lastSynced ? "Synced" : "Local only");
  }

  function updateNet() {
    const online = navigator.onLine;
    const dot = document.getElementById("netDot");
    const label = document.getElementById("netLabel");
    const btn = document.getElementById("btnSync");
    if (online) {
      dot.className = "dot online";
      label.textContent = "Online";
      btn.disabled = APPS_SCRIPT_URL.includes("PASTE_YOUR");
    } else {
      dot.className = "dot";
      label.textContent = "Offline";
      btn.disabled = true;
    }
  }

  function toast(msg, type = "ok") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show " + type;
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove("show"), 2800);
  }

  /* ---------- Sync ---------- */
  async function sync() {
    if (!navigator.onLine) {
      toast("No network – kept local", "warn");
      return;
    }
    if (APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
      toast("Set APPS_SCRIPT_URL in the HTML first", "err");
      return;
    }

    const payload = {
      timestamp: new Date().toISOString(),
      device: navigator.userAgent.slice(0, 80),
      inventory: data,
      catalogueVersion: 1
    };

    const btn = document.getElementById("btnSync");
    btn.disabled = true;
    btn.textContent = "Syncing…";

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // Apps Script prefers text/plain for simple CORS
        body: JSON.stringify(payload)
      });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); } catch { json = { ok: false, message: text }; }

      if (json.ok) {
        meta.lastSynced = new Date().toISOString();
        meta.dirty = false;
        localStorage.setItem(META_KEY, JSON.stringify(meta));
        updateMetaUI();
        toast("Synced to Google Sheet", "ok");
      } else {
        toast("Sync error: " + (json.message || "unknown"), "err");
      }
    } catch (err) {
      console.error(err);
      toast("Network/CORS error – data still local", "err");
    } finally {
      btn.disabled = !navigator.onLine;
      btn.textContent = "Sync to Google Sheet";
      updateNet();
    }
  }

  /* ---------- Export / Clear ---------- */
  function exportJSON() {
    const blob = new Blob([JSON.stringify({ meta, inventory: data }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "arahas-ppe-inventory-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("JSON exported", "ok");
  }

  function clearLocal() {
    if (!confirm("Clear all local inventory numbers? This cannot be undone on this device.")) return;
    data = {};
    meta.dirty = true;
    persist();
    render();
    toast("Local draft cleared", "warn");
  }

  /* ---------- Init ---------- */
  load();
  buildQuicknav();
  render();
  updateMetaUI();
  updateNet();

  window.addEventListener("online", () => {
    updateNet();
    toast("Back online – you can sync", "ok");
  });
  window.addEventListener("offline", () => {
    updateNet();
    toast("Offline – changes stay local", "warn");
  });

  document.getElementById("btnSync").addEventListener("click", sync);
  document.getElementById("btnSave").addEventListener("click", () => {
    if (persist()) toast("Saved locally", "ok");
  });
  document.getElementById("btnClear").addEventListener("click", clearLocal);
  document.getElementById("btnExport").addEventListener("click", exportJSON);

  let searchDebounce;
  document.getElementById("searchInput").addEventListener("input", (e) => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      searchTerm = e.target.value.trim().toLowerCase();
      render();
    }, 120);
  });

  /* auto-persist every 30s if dirty */
  setInterval(() => { if (meta.dirty) persist(); }, 30000);
  </script>
</body>
</html>
